<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>airaceGP social preview</title>
<!-- Source for og-image.png (1200x630). Render with a headless browser at that viewport. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1200px;height:630px;overflow:hidden;background:#0d0f12;color:#e8eaed;font-family:"Barlow Condensed","Arial Narrow",sans-serif;position:relative}
.grid{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 79px,rgba(232,234,237,.035) 79px 80px)}
.bar{position:absolute;left:0;top:0;bottom:0;width:10px;background:#ff5a3c}
.in{position:absolute;inset:64px 72px 56px 88px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:16px}
.top svg{width:56px;height:56px}
.name{font-weight:800;font-size:44px;letter-spacing:.01em}
.name span{color:#ff5a3c}
.tag{margin-left:auto;font:600 18px "Barlow Condensed";letter-spacing:.2em;text-transform:uppercase;color:#9aa3ad;border:1px solid rgba(232,234,237,.2);padding:10px 14px}
h1{font-weight:800;font-size:112px;line-height:.88;text-transform:uppercase;margin-top:44px}
h1 span{color:#ff5a3c;display:block}
.radio{margin-top:auto;display:flex;align-items:baseline;gap:18px;background:#15191e;border-left:4px solid #ff5a3c;padding:18px 22px;font:500 26px "JetBrains Mono",monospace}
.radio b{font:700 18px "Barlow Condensed";letter-spacing:.2em;color:#ff5a3c}
</style>
<body>
<div class="grid"></div>
<div class="bar"></div>
<div class="in">
  <div class="top">
    <svg viewBox="0 0 512 512" aria-hidden="true"><circle cx="256" cy="256" r="246" fill="#15191e" stroke="#e8eaed" stroke-width="14"/><g fill="none" stroke="#e8eaed" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"><path d="M146,410 L420,410 C452,410 458,380 452,345 C448,300 446,240 419,205 C400,150 320,96 228,98 C150,100 78,160 70,235 C64,300 90,410 146,410 Z"/><path d="M419,205 C360,200 250,200 224,250 C214,275 240,300 300,305 L452,345" stroke="#ff5a3c"/></g></svg>
    <span class="name">airace<span>GP</span></span>
    <span class="tag">AI race engineer · ACC · F1 25</span>
  </div>
  <h1>Your engineer<span>is on the radio.</span></h1>
  <div class="radio"><b>ENGINEER</b><span>McLaren ahead, 1.4, closing 0.3 a lap.</span></div>
</div>
</body>
</html>
